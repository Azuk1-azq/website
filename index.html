<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotLightning</title>
<style>
  :root{
    --bg:#0A0A0F;
    --surface:#131319;
    --surface-hi:#1B1B24;
    --line:#25252F;
    --text:#E8E8ED;
    --text-dim:#8B8B99;
    --accent:#E4FF3C;
    --accent-2:#7B61FF;
    --danger:#FF5C5C;
    --radius:2px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  button:disabled{opacity:.35;cursor:default;}
  input{font:inherit;color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{
    display:grid;
    grid-template-columns:220px 1fr;
    grid-template-rows:1fr 72px;
    height:100vh;
  }

  .bolt{
    display:inline-block;
    width:14px;height:18px;
    clip-path:polygon(60% 0%, 0% 58%, 42% 58%, 30% 100%, 100% 40%, 55% 40%);
    background:var(--accent);
    flex-shrink:0;
  }
  .brand{
    display:flex;align-items:center;gap:8px;
    padding:18px 16px;
    letter-spacing:.02em;
    font-weight:600;
    font-size:15px;
  }

  #sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  #playlists{
    flex:1;overflow-y:auto;
    padding:4px 0 12px;
  }
  .pl-item{
    display:block;width:100%;text-align:left;
    padding:9px 16px;
    color:var(--text-dim);
    border-left:2px solid transparent;
    font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pl-item:hover{color:var(--text);background:var(--surface-hi);}
  .pl-item.active{color:var(--text);border-left-color:var(--accent);background:var(--surface-hi);}
  .sidebar-section-label{
    padding:14px 16px 6px;
    font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;
  }
  .account-box{
    padding:12px 16px;
    border-top:1px solid var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .account-box img{width:24px;height:24px;object-fit:cover;flex-shrink:0;border-radius:50%;}
  .account-box .name{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .logout-btn{color:var(--text-dim);font-size:11px;text-decoration:underline;flex-shrink:0;}
  .logout-btn:hover{color:var(--text);}

  #main{
    overflow-y:auto;
    padding:0 28px 28px;
  }
  #topbar{
    position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg) 70%, transparent);
    padding:18px 0 14px;
    display:flex;align-items:center;gap:12px;
  }
  #menu-toggle{
    display:none;
    width:32px;height:32px;
    color:var(--text-dim);
    font-size:18px;
  }
  #search-form{flex:1;display:flex;}
  #search-input{
    width:100%;max-width:420px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 12px;
    color:var(--text);
  }
  #search-input:focus{outline:none;border-color:var(--accent-2);}
  #search-input::placeholder{color:var(--text-dim);}

  h1.view-title{font-size:20px;font-weight:600;margin:6px 0 16px;}
  .hint-row{color:var(--text-dim);font-size:12px;margin-bottom:16px;}

  #login-screen{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
    grid-column:1/-1;grid-row:1/-1;
  }
  #login-screen .bolt{width:34px;height:44px;}
  #login-screen h1{font-size:24px;font-weight:600;letter-spacing:.01em;}
  #login-screen p{color:var(--text-dim);max-width:340px;font-size:13px;line-height:1.6;}
  #login-btn{
    background:var(--accent);color:#0A0A0F;font-weight:600;
    padding:11px 28px;border-radius:var(--radius);
    font-size:13px;
  }
  #login-btn:hover{background:#eeff70;}
  #config-warning{
    color:var(--danger);font-size:12px;max-width:360px;line-height:1.6;
    border:1px solid var(--danger);padding:10px 14px;
  }

  .track-row{
    display:grid;grid-template-columns:32px 1fr 60px;align-items:center;
    padding:7px 10px;border-radius:var(--radius);cursor:pointer;
  }
  .track-row:hover{background:var(--surface-hi);}
  .track-row.playing .t-title{color:var(--accent);}
  .track-row .t-num{color:var(--text-dim);font-size:12px;}
  .track-row .t-art{width:32px;height:32px;object-fit:cover;margin-right:10px;}
  .track-row .t-main{display:flex;align-items:center;overflow:hidden;}
  .track-row .t-text{overflow:hidden;}
  .t-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-artist{font-size:12px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-dur{color:var(--text-dim);font-size:12px;text-align:right;}

  .empty-state{
    color:var(--text-dim);font-size:13px;padding:40px 10px;text-align:center;line-height:1.7;
  }
  .empty-state strong{color:var(--text);display:block;font-size:15px;margin-bottom:6px;font-weight:600;}

  .banner{
    border:1px solid var(--danger);color:var(--danger);
    padding:10px 14px;font-size:12px;margin-bottom:16px;line-height:1.6;
  }

  #player-bar{
    grid-column:1/-1;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:240px 1fr 200px;
    align-items:center;
    padding:0 16px;
    gap:16px;
  }
  #now-playing{display:flex;align-items:center;gap:10px;overflow:hidden;}
  #np-video-wrap{
    position:relative;width:96px;height:54px;background:#000;flex-shrink:0;overflow:hidden;
    transition:width .18s ease, height .18s ease;
  }
  #np-video-wrap iframe{width:100%;height:100%;display:block;}
  #np-video-wrap.expanded{
    position:fixed;right:16px;bottom:88px;
    width:320px;height:180px;
    z-index:30;
    border:1px solid var(--line);
    box-shadow:0 12px 32px rgba(0,0,0,.55);
  }
  #expand-toggle{
    position:absolute;top:4px;right:4px;z-index:2;
    width:20px;height:20px;
    background:rgba(0,0,0,.65);color:#fff;
    font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s;
  }
  #np-video-wrap:hover #expand-toggle,
  #np-video-wrap.expanded #expand-toggle{opacity:1;}
  #now-playing .np-text{overflow:hidden;}
  #now-playing .np-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #now-playing .np-artist{font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  #transport{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #transport-buttons{display:flex;align-items:center;gap:18px;}
  #transport-buttons button{color:var(--text);font-size:16px;}
  #transport-buttons button:hover{color:var(--accent);}
  #play-btn{
    width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  #play-btn:hover{background:var(--accent);}
  #progress-row{display:flex;align-items:center;gap:8px;width:100%;max-width:480px;}
  #progress-row span{font-size:10px;color:var(--text-dim);width:32px;}
  #progress-row span:last-child{text-align:right;}
  #seek{flex:1;-webkit-appearance:none;height:3px;background:var(--line);border-radius:2px;outline:none;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--text);}
  #seek::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--text);border:none;}

  #volume-row{display:flex;align-items:center;gap:8px;justify-self:end;}
  #volume-row span{font-size:14px;color:var(--text-dim);}
  #volume{width:90px;-webkit-appearance:none;height:3px;background:var(--line);border-radius:2px;}
  #volume::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--text-dim);}
  #volume::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--text-dim);border:none;}

  .hidden{display:none !important;}

  @media (max-width:760px){
    #app{grid-template-columns:1fr;}
    #sidebar{
      position:fixed;top:0;left:0;bottom:72px;width:220px;z-index:20;
      transform:translateX(-100%);transition:transform .18s ease;
    }
    #sidebar.open{transform:translateX(0);}
    #menu-toggle{display:block;}
    #player-bar{grid-template-columns:1fr;grid-template-rows:auto auto;padding:8px 12px;gap:6px;height:auto;}
    #volume-row{display:none;}
    #np-video-wrap{width:64px;height:36px;}
    #np-video-wrap.expanded{width:240px;height:135px;right:8px;bottom:96px;}
  }
</style>
</head>
<body>

<div id="app">

  <div id="login-screen">
    <span class="bolt"></span>
    <h1>SpotLightning</h1>
    <p>軽量なYouTube Music代替クライアント。Googleアカウントでログインすると、あなたのプレイリストと高評価した動画を再生できます。</p>
    <div id="config-warning" class="hidden"></div>
    <button id="login-btn">Googleでログイン</button>
  </div>

  <div id="sidebar" class="hidden">
    <div class="brand"><span class="bolt"></span>SpotLightning</div>
    <div class="sidebar-section-label">ライブラリ</div>
    <div id="playlists"></div>
    <div class="account-box">
      <img id="user-avatar" src="" alt="">
      <div class="name" id="user-name">-</div>
      <button class="logout-btn" id="logout-btn">ログアウト</button>
    </div>
  </div>

  <div id="main" class="hidden">
    <div id="topbar">
      <button id="menu-toggle">≡</button>
      <form id="search-form">
        <input id="search-input" type="text" placeholder="曲・アーティストを検索" autocomplete="off">
      </form>
    </div>
    <div id="view"></div>
  </div>

  <div id="player-bar" class="hidden">
    <div id="now-playing">
      <div id="np-video-wrap">
        <div id="yt-player-mount"></div>
        <button id="expand-toggle" title="映像を拡大/縮小">⤢</button>
      </div>
      <div class="np-text">
        <div class="np-title" id="np-title">再生していません</div>
        <div class="np-artist" id="np-artist"></div>
      </div>
    </div>
    <div id="transport">
      <div id="transport-buttons">
        <button id="prev-btn" title="前へ">⏮</button>
        <button id="play-btn" title="再生/一時停止">▶</button>
        <button id="next-btn" title="次へ">⏭</button>
      </div>
      <div id="progress-row">
        <span id="time-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="time-dur">0:00</span>
      </div>
    </div>
    <div id="volume-row">
      <span>♪</span>
      <input id="volume" type="range" min="0" max="100" value="50">
    </div>
  </div>

</div>

<script type="module">
/* =========================================================
   SpotLightning — YouTube Music 版 (Firebaseプロジェクト対応)
   Firebase Hosting + Firebase Authentication(Googleプロバイダ + YouTube閲覧スコープ) + YouTube Data API v3 + IFrame Player API
   外部フレームワーク・Webフォント不使用。Firebase SDKはモジュール版(必要な機能のみ)を使用
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ---- Firebaseコンソール > プロジェクトの設定 > マイアプリ から取得した設定値をここに入れる ----
const firebaseConfig = {
  apiKey: "AIzaSyAC0-9XrzUGajNUY4arbHGzMt3ALbyjDbs",
  authDomain: "a4l-f5-si.firebaseapp.com",
  projectId: "a4l-f5-si",
  storageBucket: "a4l-f5-si.firebasestorage.app",
  messagingSenderId: "1067513157556",
  appId: "1:1067513157556:web:38ea17c9a54391775644e1",
  measurementId: "G-C3PH30YJBT"
};
// -----------------------------------------------------------------------------------------

const YT_SCOPE = "https://www.googleapis.com/auth/youtube.readonly";
const LS_TOKEN = "sl_yt_token";

let app, auth, provider;
let state = {
  accessToken: null,
  expiresAt: 0,
  ytPlayer: null,
  ytReady: false,
  queue: [],
  queueIndex: -1,
  isPaused: true,
  seeking: false,
};

const el = (id) => document.getElementById(id);
const $loginScreen = el("login-screen");
const $sidebar = el("sidebar");
const $main = el("main");
const $playerBar = el("player-bar");
const $view = el("view");

function isConfigured(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY";
}

function showConfigWarning(msg){
  const w = el("config-warning");
  w.textContent = msg;
  w.classList.remove("hidden");
}

// ---------------- Firebase Auth (Google provider + YouTube scope) ----------------
function initFirebase(){
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  provider = new GoogleAuthProvider();
  provider.addScope(YT_SCOPE);
  onAuthStateChanged(auth, (user) => {
    if (user){
      el("user-name").textContent = user.displayName || user.email || "";
      el("user-avatar").src = user.photoURL || "";
    }
  });
}

function storeToken(access, expiresInSec){
  state.accessToken = access;
  state.expiresAt = Date.now() + (expiresInSec * 1000) - 60000;
  sessionStorage.setItem(LS_TOKEN, JSON.stringify({ access, expiresAt: state.expiresAt }));
}

function loadStoredToken(){
  try{
    const raw = sessionStorage.getItem(LS_TOKEN);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (Date.now() >= data.expiresAt) return false;
    state.accessToken = data.access;
    state.expiresAt = data.expiresAt;
    return true;
  }catch(e){ return false; }
}

async function beginLogin(){
  if (!isConfigured()){
    showConfigWarning("Firebase設定が未入力です。コード内のfirebaseConfigにFirebaseコンソールの値を設定してください。");
    return;
  }
  try{
    const result = await signInWithPopup(auth, provider);
    const credential = GoogleAuthProvider.credentialFromResult(result);
    if (!credential || !credential.accessToken){
      showConfigWarning("Googleからアクセストークンを取得できませんでした。もう一度お試しください。");
      return;
    }
    // Googleの提供トークンの有効期限は明示されないため、標準的な1時間として扱う
    storeToken(credential.accessToken, 3600);
    afterLogin();
  }catch(e){
    console.error(e);
    showConfigWarning("ログインに失敗しました。承認済みドメインの設定などをご確認ください。");
  }
}

function logout(){
  sessionStorage.removeItem(LS_TOKEN);
  signOut(auth).finally(() => window.location.reload());
}

function requireReauth(){
  $sidebar.classList.add("hidden");
  $main.classList.add("hidden");
  $playerBar.classList.add("hidden");
  $loginScreen.classList.remove("hidden");
  showConfigWarning("セッションの有効期限が切れました。もう一度ログインしてください。");
}

// ---------------- YouTube Data API v3 ----------------
async function api(path){
  if (Date.now() >= state.expiresAt) { requireReauth(); throw new Error("token expired"); }
  const res = await fetch("https://www.googleapis.com/youtube/v3" + path, {
    headers: { "Authorization": "Bearer " + state.accessToken },
  });
  if (!res.ok){
    const txt = await res.text().catch(()=> "");
    throw new Error("API error " + res.status + " " + txt);
  }
  return res.json();
}

function parseIsoDurationMs(iso){
  const m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || "");
  if (!m) return 0;
  const h = Number(m[1] || 0), min = Number(m[2] || 0), s = Number(m[3] || 0);
  return ((h*3600) + (min*60) + s) * 1000;
}

async function hydrateVideos(items){
  const ids = items.map(i => i.id).filter(Boolean);
  if (!ids.length) return items;
  const chunks = [];
  for (let i=0;i<ids.length;i+=50) chunks.push(ids.slice(i, i+50));
  const durMap = {};
  for (const chunk of chunks){
    const data = await api("/videos?part=contentDetails&id=" + chunk.join(","));
    (data.items || []).forEach(v => { durMap[v.id] = parseIsoDurationMs(v.contentDetails.duration); });
  }
  items.forEach(i => { i.durationMs = durMap[i.id] || 0; });
  return items;
}

// ---------------- UI shell ----------------
function showApp(){
  $loginScreen.classList.add("hidden");
  $sidebar.classList.remove("hidden");
  $main.classList.remove("hidden");
  $playerBar.classList.remove("hidden");
}

function fmtTime(ms){
  if (!ms || ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function renderEmpty(title, body){
  $view.innerHTML = '<div class="empty-state"><strong>' + title + '</strong>' + body + '</div>';
}
function renderBanner(msg){
  return '<div class="banner">' + msg + '</div>';
}
function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

// ---------------- Sidebar: recommendations + playlists + liked videos ----------------
async function loadPlaylists(){
  const $pl = el("playlists");
  $pl.innerHTML = "";

  const recBtn = document.createElement("button");
  recBtn.className = "pl-item active";
  recBtn.textContent = "おすすめ";
  recBtn.addEventListener("click", () => {
    document.querySelectorAll(".pl-item").forEach(b=>b.classList.remove("active"));
    recBtn.classList.add("active");
    loadRecommendations();
    closeSidebarOnMobile();
  });
  $pl.appendChild(recBtn);

  const likedBtn = document.createElement("button");
  likedBtn.className = "pl-item";
  likedBtn.textContent = "高評価した動画";
  likedBtn.addEventListener("click", () => {
    document.querySelectorAll(".pl-item").forEach(b=>b.classList.remove("active"));
    likedBtn.classList.add("active");
    loadPlaylistTracks("LL", "高評価した動画");
    closeSidebarOnMobile();
  });
  $pl.appendChild(likedBtn);

  try{
    const data = await api("/playlists?part=snippet&mine=true&maxResults=50");
    (data.items || []).forEach(pl => {
      const btn = document.createElement("button");
      btn.className = "pl-item";
      btn.textContent = pl.snippet.title;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pl-item").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        loadPlaylistTracks(pl.id, pl.snippet.title);
        closeSidebarOnMobile();
      });
      $pl.appendChild(btn);
    });
  }catch(e){
    console.error(e);
  }
}

async function loadPlaylistTracks(playlistId, title){
  renderEmpty("読み込み中…", "");
  try{
    const data = await api("/playlistItems?part=snippet&playlistId=" + playlistId + "&maxResults=50");
    const items = (data.items || [])
      .filter(i => i.snippet && i.snippet.resourceId && i.snippet.resourceId.videoId)
      .map(i => ({
        id: i.snippet.resourceId.videoId,
        title: i.snippet.title,
        artist: i.snippet.videoOwnerChannelTitle || i.snippet.channelTitle || "",
        thumb: (i.snippet.thumbnails && (i.snippet.thumbnails.default || i.snippet.thumbnails.medium)) ? (i.snippet.thumbnails.default || i.snippet.thumbnails.medium).url : "",
      }));
    await hydrateVideos(items);
    renderTrackList(title, items);
  }catch(e){
    console.error(e);
    $view.innerHTML = renderBanner("読み込めませんでした。プレイリストが空か、非公開の可能性があります。");
  }
}

function renderTrackList(title, items){
  if (!items.length){
    renderEmpty("曲がありません", "このリストにはまだ曲が追加されていません。");
    return;
  }
  const rows = items.map((t, i) => (
    '<div class="track-row" data-index="' + i + '">' +
      '<span class="t-num">' + (i+1) + '</span>' +
      '<div class="t-main">' +
        '<img class="t-art" src="' + t.thumb + '" alt="">' +
        '<div class="t-text">' +
          '<div class="t-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="t-artist">' + escapeHtml(t.artist) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="t-dur">' + fmtTime(t.durationMs) + '</div>' +
    '</div>'
  )).join("");
  $view.innerHTML = '<h1 class="view-title">' + escapeHtml(title) + '</h1>' + rows;
  $view.querySelectorAll(".track-row").forEach(row => {
    row.addEventListener("click", () => {
      const idx = Number(row.dataset.index);
      playQueue(items, idx);
    });
  });
}

function closeSidebarOnMobile(){
  if (window.innerWidth <= 760) $sidebar.classList.remove("open");
}

// ---------------- Search ----------------
let searchDebounce = null;
el("search-form").addEventListener("submit", e => e.preventDefault());
el("search-input").addEventListener("input", e => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q){ renderEmpty("SpotLightning", "曲名やアーティスト名で検索するか、左のライブラリを選んでください。"); return; }
  searchDebounce = setTimeout(() => runSearch(q), 350);
});

async function runSearch(query){
  renderEmpty("検索中…", "");
  try{
    const data = await api("/search?part=snippet&type=video&videoCategoryId=10&maxResults=25&q=" + encodeURIComponent(query));
    const items = (data.items || [])
      .filter(i => i.id && i.id.videoId)
      .map(i => ({
        id: i.id.videoId,
        title: i.snippet.title,
        artist: i.snippet.channelTitle,
        thumb: (i.snippet.thumbnails && (i.snippet.thumbnails.default || i.snippet.thumbnails.medium)) ? (i.snippet.thumbnails.default || i.snippet.thumbnails.medium).url : "",
      }));
    if (!items.length){
      renderEmpty("見つかりませんでした", '「' + escapeHtml(query) + '」に一致する曲がありません。');
      return;
    }
    await hydrateVideos(items);
    renderTrackList("検索結果: " + query, items);
  }catch(e){
    console.error(e);
    $view.innerHTML = renderBanner("検索に失敗しました。しばらくしてから再度お試しください。");
  }
}

// ---------------- Playback (YouTube IFrame Player API) ----------------
// 注: YouTubeの利用規約により、再生中はプレーヤーを常に画面上に表示する必要があるため、
// 音声のみを隠して再生することはせず、プレーヤー映像はミニサイズで常時表示しています。
function loadIframeApi(){
  return new Promise((resolve) => {
    if (window.YT && window.YT.Player){ resolve(); return; }
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  });
}

async function initPlayer(){
  await loadIframeApi();
  state.ytPlayer = new YT.Player("yt-player-mount", {
    height: "54",
    width: "96",
    playerVars: { autoplay: 0, controls: 0, rel: 0, playsinline: 1 },
    events: {
      onReady: () => { state.ytReady = true; },
      onStateChange: onPlayerStateChange,
      onError: (e) => { console.error("YT player error", e); },
    },
  });
}

function onPlayerStateChange(e){
  if (e.data === YT.PlayerState.PLAYING){ state.isPaused = false; }
  if (e.data === YT.PlayerState.PAUSED){ state.isPaused = true; }
  if (e.data === YT.PlayerState.ENDED){ nextTrack(); }
  updateTransportUI();
}

function playQueue(items, index){
  state.queue = items;
  state.queueIndex = index;
  playCurrent();
}

function playCurrent(){
  const track = state.queue[state.queueIndex];
  if (!track || !state.ytPlayer) return;
  state.ytPlayer.loadVideoById(track.id);
  state.isPaused = false;
  el("np-title").textContent = track.title;
  el("np-artist").textContent = track.artist;
  document.querySelectorAll(".track-row").forEach((row, i) => {
    row.classList.toggle("playing", i === state.queueIndex);
  });
  updateTransportUI();
}

function nextTrack(){
  if (state.queueIndex < state.queue.length - 1){
    state.queueIndex++;
    playCurrent();
  }
}
function prevTrack(){
  if (state.queueIndex > 0){
    state.queueIndex--;
    playCurrent();
  }
}
function togglePlay(){
  if (!state.ytPlayer) return;
  if (state.isPaused){ state.ytPlayer.playVideo(); } else { state.ytPlayer.pauseVideo(); }
}

function updateTransportUI(){
  el("play-btn").textContent = state.isPaused ? "▶" : "⏸";
  el("prev-btn").disabled = state.queueIndex <= 0;
  el("next-btn").disabled = state.queueIndex < 0 || state.queueIndex >= state.queue.length - 1;
}

setInterval(() => {
  if (!state.ytReady || !state.ytPlayer || state.seeking || state.queueIndex < 0) return;
  try{
    const cur = state.ytPlayer.getCurrentTime() * 1000;
    const dur = state.ytPlayer.getDuration() * 1000;
    el("time-cur").textContent = fmtTime(cur);
    el("time-dur").textContent = fmtTime(dur);
    if (dur > 0) el("seek").value = Math.round((cur / dur) * 1000);
  }catch(e){}
}, 500);

// ---------------- Transport controls ----------------
el("play-btn").addEventListener("click", togglePlay);
el("next-btn").addEventListener("click", nextTrack);
el("prev-btn").addEventListener("click", prevTrack);

const $seek = el("seek");
$seek.addEventListener("mousedown", () => state.seeking = true);
$seek.addEventListener("touchstart", () => state.seeking = true);
$seek.addEventListener("change", () => {
  if (!state.ytPlayer || state.queueIndex < 0){ state.seeking = false; return; }
  try{
    const dur = state.ytPlayer.getDuration();
    const ratio = Number($seek.value) / 1000;
    state.ytPlayer.seekTo(ratio * dur, true);
  }catch(e){}
  state.seeking = false;
});

el("volume").addEventListener("input", (e) => {
  if (state.ytPlayer) state.ytPlayer.setVolume(Number(e.target.value));
});

el("menu-toggle").addEventListener("click", () => $sidebar.classList.toggle("open"));
el("logout-btn").addEventListener("click", logout);
el("login-btn").addEventListener("click", beginLogin);

// ---------------- Boot ----------------
function afterLogin(){
  showApp();
  renderEmpty("SpotLightning", "曲名やアーティスト名で検索するか、左のライブラリを選んでください。");
  loadPlaylists();
  initPlayer();
}

function boot(){
  initFirebase();
  if (loadStoredToken()){
    afterLogin();
  }
}

boot();
</script>
